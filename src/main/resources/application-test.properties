myboot.name=MySpring TEST

# log level
logging.level.com.basic.myspringboot=debug

# MariaDB 연결 (application.properties와 동일하게 맞춤)
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/boot_db
spring.datasource.username=boot
spring.datasource.password=boot
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate 설정 추가 (이게 없어서 테이블이 안 만들어진 거예요!)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect